<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DuckGoDo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161716">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DuckGoDo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header class="top">
        <div class="titles">
            <div class="eyebrow" id="eyebrow">DuckGoDo</div>
            <h1 id="title">Quick log</h1>
        </div>
        <button type="button" class="chip" id="chip" data-act="chip" aria-label="Sync status"><span class="dot"></span><span id="chip-text">…</span></button>
    </header>
    <div class="daybar" id="daybar"></div>
    <main id="view"></main>
    <button type="button" class="fab" id="fab" data-act="food-add" hidden>+ Add food</button>
    <nav class="tabs" id="tabs">
        <button type="button" class="tab" data-tab="ql"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5.5"/></svg><span>Quick log</span></button>
        <button type="button" class="tab" data-tab="food"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8"/><path d="M11 3v8a2 2 0 0 1-2 2"/><path d="M7 3v5"/><path d="M11 3v5"/><path d="M17 21V3c-2.5 1.5-3.5 4-3.5 7.5 0 1.5 1 2.5 2 2.5h1.5"/></svg><span>Food</span></button>
        <button type="button" class="tab" data-tab="sc"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/></svg><span>Schedule</span></button>
    </nav>
</div>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
